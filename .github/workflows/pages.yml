name: Validar e publicar Plexo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check admin.js

      - name: Verificar configuração pública
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sb_publishable_' config.js
          ! grep -Eq 'sb_secret_[A-Za-z0-9_-]{10,}|service_role' config.js admin.js index.html admin.html styles.css admin.css
          ! grep -R '__SUPABASE_' index.html app.js config.js styles.css admin.html admin.js admin.css
          test -f assets/fundo-plexo.webp
          test -f admin.html
          test -f admin.js
          test -f admin.css

      - name: Validar proteções do frontend
        shell: bash
        run: |
          set -euo pipefail
          grep -q "script-src 'self'" index.html
          grep -q "script-src 'self'" admin.html
          grep -q "connect-src 'self' https://yncspxfsvlqdnodlsosb.supabase.co" index.html
          grep -q "connect-src 'self' https://yncspxfsvlqdnodlsosb.supabase.co" admin.html
          grep -q 'noindex,nofollow' admin.html
          grep -q 'plexo_survey_admin' admin.js
          grep -q 'sessionStorage' admin.js
          grep -q '/auth/v1' admin.js
          grep -q 'Responder novamente' index.html
          ! grep -Eq 'innerHTML|outerHTML|insertAdjacentHTML|document\.write' app.js admin.js
          ! grep -Eq '<script[^>]+src="https?://' index.html admin.html
          ! grep -Eq 'http://' index.html admin.html app.js admin.js config.js styles.css admin.css

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar site estático
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html styles.css app.js config.js admin.html admin.css admin.js robots.txt .nojekyll _site/
          cp assets/fundo-plexo.webp _site/assets/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
